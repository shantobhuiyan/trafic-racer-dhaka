let AC=null;

function help(){beep(520);ov(`<h2>কীভাবে খেলব</h2><p>৬ লেনের দুই-মুখী রাস্তা। বাঁয়ের ৩ লেন তোমার দিকের, ডানের ৩ লেন উল্টো দিকের। ডানে গ্যাস, ব্রেক ও বুস্ট।</p><p>প্রতি ১ কিমিতে চৌরাস্তা ও ট্র্যাফিক বাতি। লাল বাতিতে ব্রেক করে দাঁড়াও, না দাঁড়ালে কয়েন ১০% কাটা যাবে। মোড়ে একদম বাঁয়ের লেনে ◀ অথবা ৩য় লেনে ▶ চাপলে বামে/ডানে ঘুরবে।</p><p><b>◀ ▶</b> লেন বদলাও। <b>🛑</b> চেপে ধরলে ব্রেক। <b>🚀</b> চেপে ধরলে গতি বাড়ে। <b>📯 হর্ন</b> দিলে সামনের গাড়ি পাশে সরে যায়।</p><p>উল্টো দিকের লেনে গেলে পয়েন্ট ×৩, কিন্তু ঝুঁকি বেশি! কাছ দিয়ে পার হলেও বোনাস।</p><p>⚠ একটা ধাক্কাতেই যাত্রা শেষ! 🛡️ ঢাল কুড়ালে একবার বাঁচবে। 🔫 গুলি কুড়িয়ে 🔫 বাটনে (কিবোর্ডে F) সামনের গাড়ি উড়িয়ে দাও। ৳ কয়েন ১৫টির লাইনে আসে। 🕊️ কুড়ালে ১৫ সেকেন্ড উড়বে, ধাক্কা লাগবে না।</p><p>প্রতি ২ কিমিতে এক স্টেশন। সব পেরিয়ে উত্তরা উত্তর পৌঁছালে জয়!</p><p>কিবোর্ড: ←→ লেন, ↑ গ্যাস, ↓ ব্রেক, H হর্ন, F গুলি, Shift বুস্ট, P বিরতি।</p><button class="bt" id="a">বুঝেছি</button>${CR}`);$("#a").onclick=menu}

 if(jn&&((g.lane===0&&d<0)||(g.lane===2&&d>0))){jn.turned=1;g.tn={d,a:0};pop(W/2,H*.4,d<0?"বামে ঘুরছ":"ডানে ঘুরছ","#9ff0c4");beep(600,.2,"triangle");return}
